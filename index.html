<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roblox - Enjoy up to 25% more Robux</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #f4f5f7;
            color: #111;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding-bottom: 90px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            position: relative;
        }
        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #fff;
            border-bottom: 1px solid #e5e5e5;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-logo {
            font-weight: 900;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .nav-logo span {
            background: #000;
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .balance-badge {
            background: #f1f1f2;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-send-top {
            background: #111;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        /* Banner */
        .banner {
            background: #111;
            color: #fff;
            margin: 16px;
            padding: 24px 16px;
            border-radius: 16px;
            text-align: center;
        }
        .banner h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .banner p {
            font-size: 13px;
            opacity: 0.8;
        }
        /* Section Title */
        .section-title {
            padding: 0 16px;
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 12px;
        }
        /* Package List */
        .pkg-list {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .pkg-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            border: 1.5px solid #e5e7eb;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
        }
        .pkg-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .robux-circle {
            width: 32px;
            height: 32px;
            background: #00b06f;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
        }
        .pkg-name {
            font-size: 15px;
            font-weight: 700;
        }
        .pkg-price {
            background: #111;
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
        }
